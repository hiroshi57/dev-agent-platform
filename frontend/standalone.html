<body><div style="max-width:880px;margin:0 auto 4px;background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:10px 14px;font:13.5px system-ui;color:#7a5b00">🔬 <b>入力するだけで計算します</b>：AIを使った仕事と使わなかった仕事の「かかった日数」を入れると、<b>本当に速くなったのか</b>を自動で比べます。難しい知識は要りません。</div>
<div id="root"></div>
<script type="text/plain" id="__jsx">
// 「作業」= プログラムの修正1件（開発現場ではPR/プルリクエストと呼ばれるもの）
const W0=[
  {name:"検索画面を速くする",   ai:"使った",   days:1.0, fix:1, redo:"なし"},
  {name:"ログイン不具合の修正", ai:"使った",   days:1.5, fix:2, redo:"あり"},
  {name:"新しい通知機能",       ai:"使った",   days:1.2, fix:1, redo:"なし"},
  {name:"請求処理の改修",       ai:"使わない", days:3.5, fix:4, redo:"なし"},
  {name:"管理画面の整理",       ai:"使わない", days:3.0, fix:3, redo:"なし"},
  {name:"テスト環境の改善",     ai:"使わない", days:2.8, fix:5, redo:"あり"},
];
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;


// ===== 自動保存 & データ書き出し/読み込み（入力内容がリロードで消えないようにする） =====
const STORE="devagent_v1";
function usePersist(name,initial){
  const [v,setV]=React.useState(function(){
    try{var s=localStorage.getItem(STORE+":"+name);return s?JSON.parse(s):initial;}catch(e){return initial;}
  });
  React.useEffect(function(){
    try{localStorage.setItem(STORE+":"+name,JSON.stringify(v));}catch(e){}
  },[name,v]);
  return [v,setV];
}
function collectAll(){
  var o={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf(STORE+":")===0){try{o[k.slice(STORE.length+1)]=JSON.parse(localStorage.getItem(k));}catch(e){}}
  }
  return o;
}
function DataBar(){
  const [msg,setMsg]=React.useState("");
  const fileRef=React.useRef(null);
  const save=function(){
    try{
      var data={_tool:STORE,_savedAt:new Date().toISOString(),data:collectAll()};
      var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);
      a.download=STORE+"_"+new Date().toISOString().slice(0,10)+".json";
      a.click();URL.revokeObjectURL(a.href);
      setMsg("書き出しました");setTimeout(function(){setMsg("");},2500);
    }catch(e){setMsg("書き出しに失敗しました");}
  };
  const load=function(e){
    var f=e.target.files&&e.target.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var j=JSON.parse(rd.result);
        if(!j||!j.data)throw new Error("形式が違います");
        if(j._tool&&j._tool!==STORE){ if(!confirm("別のツールのファイルのようです。読み込みますか？"))return; }
        Object.keys(j.data).forEach(function(k){localStorage.setItem(STORE+":"+k,JSON.stringify(j.data[k]));});
        location.reload();
      }catch(err){setMsg("読み込めませんでした（"+err.message+"）");}
    };
    rd.readAsText(f);
  };
  const clear=function(){
    if(!confirm("入力した内容をすべて消して、最初の状態に戻します。よろしいですか？"))return;
    var del=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(STORE+":")===0)del.push(k);}
    del.forEach(function(k){localStorage.removeItem(k);});
    location.reload();
  };
  return (<div style={{background:"#f2f7f4",border:"1px solid #cfe3d8",borderRadius:10,padding:"9px 12px",
      margin:"0 0 12px",fontSize:13,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",color:"#0f5c3f"}}>
    <span>💾 <b>入力した内容はこの端末に自動保存されます</b>（閉じても消えません）</span>
    <span style={{flex:1}}></span>
    <button onClick={save} style={{border:0,borderRadius:7,background:"#17a673",color:"#fff",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>データを書き出す</button>
    <button onClick={function(){fileRef.current&&fileRef.current.click();}} style={{border:0,borderRadius:7,background:"#e7f0eb",color:"#0f5c3f",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>読み込む</button>
    <button onClick={clear} style={{border:0,borderRadius:7,background:"#f7e4e4",color:"#c0392b",padding:"6px 11px",cursor:"pointer",fontSize:12.5}}>最初に戻す</button>
    <input ref={fileRef} type="file" accept="application/json" onChange={load} style={{display:"none"}}/>
    {msg && <span style={{color:"#0f5c3f",fontWeight:"bold"}}>{msg}</span>}
  </div>);
}

function App(){
  const [rows,setRows]=usePersist("rows",W0);
  const ai=rows.filter(r=>r.ai==="使った"), non=rows.filter(r=>r.ai==="使わない");
  const dAi=avg(ai.map(r=>r.days)), dNon=avg(non.map(r=>r.days));
  const fAi=avg(ai.map(r=>r.fix)), fNon=avg(non.map(r=>r.fix));
  const rAi=ai.length?Math.round(ai.filter(r=>r.redo==="あり").length/ai.length*100):0;
  const rNon=non.length?Math.round(non.filter(r=>r.redo==="あり").length/non.length*100):0;
  const cut=dNon>0?Math.round((dNon-dAi)/dNon*100):0;
  const both=ai.length>0&&non.length>0;
  const enough=ai.length>=5&&non.length>=5;
  const maxD=Math.max(dAi,dNon,0.1);
  // 総合判定
  let vc="vmid", vt="", vd="";
  if(!both){vc="vmid";vt="まだ比べられません";vd="「使った」仕事と「使わない」仕事の両方を入力してください。片方だけでは比較できません。";}
  else if(cut>=25 && rAi<=rNon){vc="vgood";vt="✅ AIの効果あり：速くなり、やり直しも増えていません";vd="AIを使った仕事は平均"+dAi.toFixed(1)+"日、使わない仕事は"+dNon.toFixed(1)+"日。約"+cut+"%短くなっています。やり直しも増えていないので、品質を落とさずに速くなっています。";}
  else if(cut>=25 && rAi>rNon){vc="vmid";vt="🟡 速いが、やり直しが増えています";vd="日数は"+cut+"%短縮できていますが、やり直しがAI"+rAi+"%・使わない"+rNon+"%と増えています。「速いけど雑」になっている可能性があります。";}
  else if(cut>0){vc="vmid";vt="🟡 少しだけ速い（誤差の可能性あり）";vd="短縮は"+cut+"%です。件数が少ないと偶然でこの程度の差は出ます。もっと件数を増やして確かめてください。";}
  else {vc="vbad";vt="🔴 いまのところ速くなっていません";vd="AIを使った仕事のほうが日数が長い、または同じです。使い方（どの工程に使うか）を見直す必要があります。";}

  const upd=(i,k,v)=>setRows(rs=>rs.map((r,j)=>j===i?{...r,[k]:(k==="name"||k==="ai"||k==="redo")?v:(Number(v)||0)}:r));
  const del=i=>setRows(rs=>rs.filter((_,j)=>j!==i));
  const add=()=>setRows(rs=>[...rs,{name:"新しい作業",ai:"使った",days:1,fix:1,redo:"なし"}]);
  const d1=n=>n.toFixed(1);

  return (<div className="wrap"><DataBar/>
    <h1>AI導入で仕事は速くなった？</h1>
    <div className="sub" style={{marginBottom:10}}>AIを使った仕事と使わなかった仕事を並べて、本当に効果があったかを確かめるツールです。</div>

    <div className="card">
      <div className="intro">
        <div className="q">🎯 このツールで分かること</div>
        <div>「AIを導入したけど、実際に速くなったの？」という質問に、<b>数字で答えられるようになります</b>。上司や役員への報告、お客様への実績提示にそのまま使えます。</div>
        <div className="q" style={{marginTop:12}}>🙋 こんな人向け</div>
        <div>・AI導入の効果を<b>説明する立場</b>の人（部門長・情報システム・経営企画）<br/>
          ・「なんとなく速くなった気がする」を<b>数字にしたい</b>人<br/>
          ・AIツールの契約更新を<b>判断する</b>人</div>
        <div className="q" style={{marginTop:12}}>📝 やること（1分で終わります）</div>
        <div>下の表に、最近終わった仕事を並べて<b>「AIを使ったか」と「何日かかったか」</b>を入れるだけです。計算は自動です。</div>
      </div>
    </div>

    <div className="card">
      <div className="stepbadge">STEP 1</div>
      <h2>最近終わった仕事を入力してください</h2>
      <div className="guide">
        👇 <b>ここを触ってください。</b>数字を書き換えると、下の結果がすぐに変わります。<br/>
        ・<b>AIを使った？</b>…その仕事でAI（ChatGPTやCopilotなど）を使ったかどうかを選ぶ<br/>
        ・<b>かかった日数</b>…始めてから終わるまで何日かかったか（半日なら0.5）<br/>
        ・<b>手直しの回数</b>…チェックを受けて直した回数<br/>
        ・<b>やり直し</b>…完成後に「これはダメ」となって元に戻したことがあるか
      </div>
      <table style={{marginTop:12}}><thead><tr>
        <th className="l">どんな仕事だったか</th>
        <th>AIを使った？</th>
        <th>かかった日数</th>
        <th>手直しの回数</th>
        <th>やり直しが<br/>発生した？</th><th></th></tr></thead>
        <tbody>{rows.map((r,i)=>(<tr key={i}>
          <td className="l"><input className="nm" value={r.name} onChange={e=>upd(i,"name",e.target.value)}/></td>
          <td><select value={r.ai} onChange={e=>upd(i,"ai",e.target.value)}><option>使った</option><option>使わない</option></select></td>
          <td><input value={r.days} onChange={e=>upd(i,"days",e.target.value)}/> 日</td>
          <td><input value={r.fix} onChange={e=>upd(i,"fix",e.target.value)}/> 回</td>
          <td><select value={r.redo} onChange={e=>upd(i,"redo",e.target.value)}><option>なし</option><option>あり</option></select></td>
          <td><button className="del" onClick={()=>del(i)}>×</button></td></tr>))}
        </tbody></table>
      <button className="add" onClick={add}>＋ 仕事を1件追加する</button>
      <button className="ghost" onClick={()=>setRows(W0)}>最初の例に戻す</button>
      <div className="src">
        <b>❓ この数字はどこから取ってくるの？</b>
        <div>・<b>かかった日数</b>：担当者に聞く／作業管理ツール（Jira・Backlog・GitHub・Asanaなど）の「作成日」と「完了日」の差を見る。ざっくりで構いません（0.5日単位で十分）。</div>
        <div>・<b>手直しの回数</b>：レビューやチェックで指摘された回数。記録がなければ担当者の記憶でOK。</div>
        <div>・<b>やり直し</b>：リリース後に取り消した／作り直した仕事があれば「あり」。</div>
        <div>・<b>ポイント</b>：完璧な数字は不要です。同じ人が同じ基準で数えることが大事です。まずは直近10件くらいから始めてください。</div>
        <div style={{marginTop:6}}>・<b>いま表示されている6件は、使い方を示すための例です</b>（架空の数字です。実際の記録ではありません）。ご自身の仕事に書き換えてお使いください。</div>
      </div>
    </div>

    <div className="card">
      <div className="stepbadge">STEP 2</div>
      <h2>結果：AIの効果はこうなりました</h2>
      <div className={"verdict "+vc}>
        <div className="big">{vt}</div>
        <div className="desc">{vd}</div>
      </div>
      {!both && <div className="warn">⚠ 「使った」と「使わない」の<b>両方</b>を入力すると比較できます。いま「使った」{ai.length}件・「使わない」{non.length}件です。</div>}
      {both && !enough && <div className="warn">⚠ 件数が少ないため（使った{ai.length}件・使わない{non.length}件）、この差は<b>偶然の可能性</b>があります。それぞれ5件以上あると信頼できます。</div>}

      {both && <React.Fragment>
        <div className="metrics" style={{marginTop:14}}>
          <div className="metric"><div className="val">{d1(dAi)}日</div><div className="l">AIを使った仕事の<br/>平均日数</div></div>
          <div className="metric"><div className="val">{d1(dNon)}日</div><div className="l">AIを使わない仕事の<br/>平均日数</div></div>
          <div className="metric"><div className="val" style={{color:cut>=0?"#0f7a54":"#c0392b"}}>{cut>=0?"−"+cut+"%":"+"+Math.abs(cut)+"%"}</div><div className="l">{cut>=0?"日数が短くなった割合":"日数が長くなった割合"}</div></div>
          <div className="metric"><div className="val">{d1(dNon-dAi)}日</div><div className="l">1件あたり<br/>浮いた日数</div></div>
        </div>
        <div className="barlabel">1件あたりの平均日数（棒が短いほど速い）</div>
        <div className="barbg"><div className="barfill" style={{width:(dNon/maxD*100)+"%",background:"#9aa5b1"}}>AIなし {d1(dNon)}日</div></div>
        <div className="barbg"><div className="barfill" style={{width:(dAi/maxD*100)+"%",background:"#2b6cb0"}}>AIあり {d1(dAi)}日</div></div>

        <h3 style={{marginTop:16}}>品質は落ちていないか（ここも必ず見てください）</h3>
        <table><thead><tr><th className="l">見るところ</th><th>AIを使った</th><th>AIを使わない</th><th>判定</th></tr></thead><tbody>
          <tr><td className="l">平均日数</td><td>{d1(dAi)}日</td><td>{d1(dNon)}日</td>
            <td style={{color:dAi<=dNon?"#0f7a54":"#c0392b",fontWeight:"bold"}}>{dAi<=dNon?"◎ 速い":"× 遅い"}</td></tr>
          <tr><td className="l">手直しの回数</td><td>{d1(fAi)}回</td><td>{d1(fNon)}回</td>
            <td style={{color:fAi<=fNon?"#0f7a54":"#c0392b",fontWeight:"bold"}}>{fAi<=fNon?"◎ 少ない":"× 多い（要注意）"}</td></tr>
          <tr><td className="l">やり直しの割合</td><td>{rAi}%</td><td>{rNon}%</td>
            <td style={{color:rAi<=rNon?"#0f7a54":"#c0392b",fontWeight:"bold"}}>{rAi<=rNon?"◎ 増えていない":"× 増えている（要注意）"}</td></tr>
        </tbody></table>
        <div className="hint">※「速いけど手直しややり直しが増えた」場合、実際には得をしていません。3つセットで見るのが重要です。</div>
      </React.Fragment>}
    </div>

    <div className="card">
      <div className="stepbadge">STEP 3</div>
      <h2>次に何をすればいいか</h2>
      <div className="todo">
        <b>やることリスト</b>
        <ul>
          {!both && <li>まず「AIを使わない仕事」も入力してください。比較の相手がないと効果は測れません。</li>}
          {both && !enough && <li><b>件数を増やす</b>：それぞれ5件以上（できれば10件）入力してください。いまは偶然の差かもしれません。</li>}
          {both && cut<25 && cut>=0 && <li><b>AIを使う場面を広げる</b>：いまは効果が小さいです。「調べる・下書きを作る・確認する」など<b>作業の前後にも</b>使ってみてください。</li>}
          {both && cut<0 && <li><b>使い方を見直す</b>：AIを使った仕事のほうが時間がかかっています。難しい仕事にだけAIを使っていませんか？まずは<b>単純な作業</b>で試してください。</li>}
          {both && rAi>rNon && <li><b>チェックを強める</b>：やり直しが増えています。AIが作ったものは<b>必ず人が確認する</b>ルールにしてください。</li>}
          {both && fAi>fNon && <li><b>指示の型を作る</b>：手直しが多いのは、AIへの指示があいまいなためかもしれません。うまくいった指示文を<b>チームで共有</b>してください。</li>}
          {both && cut>=25 && rAi<=rNon && fAi<=fNon && <li><b>報告に使う</b>：この結果はそのまま上司・役員への報告資料に使えます（下の文例をご利用ください）。</li>}
          {both && cut>=25 && <li><b>横に広げる</b>：効果が出ているので、他のチームにも同じ使い方を展開してください。</li>}
        </ul>
      </div>
      {both && cut>0 && <div className="todo" style={{background:"#f7fbf9",borderColor:"#cfe3d8"}}>
        <b>📋 そのまま使える報告文</b>
        <div style={{marginTop:8,fontSize:14,lineHeight:1.9,background:"#fff",padding:"12px",borderRadius:8}}>
          「AI活用の効果を実測しました。対象{rows.length}件のうち、AIを使った{ai.length}件は平均{d1(dAi)}日、
          使わなかった{non.length}件は平均{d1(dNon)}日で、<b>1件あたり{d1(dNon-dAi)}日（約{cut}%）短縮</b>しました。
          手直し回数は{d1(fAi)}回対{d1(fNon)}回、やり直し発生率は{rAi}%対{rNon}%で、
          {rAi<=rNon&&fAi<=fNon?"品質面の悪化は見られません":"品質面は注意が必要です"}。」
        </div>
        <div className="hint">※件数が少ない場合は「暫定値」と添えてください。</div>
      </div>}
    </div>

    <p className="note">※このツールは入力された数字だけを使って計算しています（あらかじめ決めた答えを出しているわけではありません）。<br/>
    ※ただし「AIを使ったから速くなった」と断定はできません。簡単な仕事にAIを使っていた、担当者の経験が違ったなど、別の理由でも差は出ます。より正確に測るには、同じくらいの難しさの仕事で比べてください。<br/>
    ※「書いた行数」は指標に入れていません。行数は簡単に増やせるため、多く書いた人が優秀に見えてしまい、判断を誤らせるからです。</p>
  </div>);
}

function ActionBar(){
  const [msg,setMsg]=React.useState("");
  // 画面の内容をテキストとして取り出し、Excel等に貼れる形でコピーする
  const copyAll=function(){
    try{
      var root=document.getElementById("root");
      var out=[];
      root.querySelectorAll("h1,h2,h3,table,.metric,.verdict,.todo li,.chk").forEach(function(el){
        if(el.tagName==="TABLE"){
          el.querySelectorAll("tr").forEach(function(tr){
            var cells=[];
            tr.querySelectorAll("th,td").forEach(function(td){
              var inp=td.querySelector("input,select");
              cells.push(((inp?inp.value:td.textContent)||"").trim().replace(/\s+/g," "));
            });
            if(cells.join("").trim())out.push(cells.join("\t"));
          });
          out.push("");
        }else{
          var t=(el.textContent||"").trim().replace(/\s+/g," ");
          if(t)out.push(t);
        }
      });
      var text=out.join("\n");
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){setMsg("コピーしました（Excelやメールに貼れます）");},function(){fallback(text);});
      }else fallback(text);
      function fallback(t){
        var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
        try{document.execCommand("copy");setMsg("コピーしました");}catch(e){setMsg("コピーできませんでした");}
        document.body.removeChild(ta);
      }
      setTimeout(function(){setMsg("");},3000);
    }catch(e){setMsg("コピーできませんでした");}
  };
  return (<div className="noprint" style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",margin:"0 0 12px"}}>
    <button onClick={function(){window.print();}}
      style={{border:0,borderRadius:8,background:"#334155",color:"#fff",padding:"8px 14px",cursor:"pointer",fontSize:13}}>
      🖨 印刷 / PDFで保存</button>
    <button onClick={copyAll}
      style={{border:0,borderRadius:8,background:"#e2e8f0",color:"#334155",padding:"8px 14px",cursor:"pointer",fontSize:13}}>
      📋 結果をコピー（Excelに貼れます）</button>
    {msg && <span style={{fontSize:12.5,color:"#0f5c3f",fontWeight:"bold"}}>{msg}</span>}
  </div>);
}
function Footer(){
  return (<div className="wrap" style={{margin:"24px auto 8px",fontSize:11.5,color:"#8a8f9c",lineHeight:1.9,
      borderTop:"1px solid #e0e6ec",paddingTop:12}}>
    <div><b style={{color:"#556"}}>提供</b>：株式会社デジタルアイデンティティ</div>
    <div><b style={{color:"#556"}}>データの取り扱い</b>：入力された内容は<b>お使いの端末の中だけ</b>に保存されます。当社のサーバーへ送信・保存されることはありません。端末を共有している場合は、画面上の「最初に戻す」で消去してください。</div>
    <div><b style={{color:"#556"}}>ご利用にあたって</b>：本ツールの計算結果は<b>判断の材料</b>であり、成果を保証するものではありません。最終的な意思決定はご自身の責任で行ってください。本ツールの利用により生じた損害について、当社は責任を負いかねます。</div>
    <div className="printonly">印刷日: {new Date().toLocaleDateString("ja-JP")}</div>
  </div>);
}
function Root(){return (<React.Fragment><ShareBar/><ActionBar/><App/><Footer/></React.Fragment>);}


// ===== サーバー保管・複数人共有 =====
const API="https://di-tools-api.vercel.app/api/workspace";
function qs(k){try{return new URLSearchParams(location.search).get(k)||"";}catch(e){return "";}}
function ShareBar(){
  const [busy,setBusy]=React.useState(false);
  const [msg,setMsg]=React.useState("");
  const [info,setInfo]=React.useState(function(){
    try{var s=localStorage.getItem(STORE+":__share");return s?JSON.parse(s):null;}catch(e){return null;}
  });
  const [who,setWho]=React.useState(function(){
    try{return localStorage.getItem("di_who")||"";}catch(e){return "";}
  });
  const [loaded,setLoaded]=React.useState(null);
  const [title,setTitle]=React.useState("");

  // 共有リンクで開かれた場合はサーバーから読み込む
  React.useEffect(function(){
    var id=qs("ws"); if(!id)return;
    var key=qs("key");
    setBusy(true);
    fetch(API+"?id="+encodeURIComponent(id))
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg("読み込めませんでした: "+j.error);setBusy(false);return;}
        Object.keys(j.data||{}).forEach(function(k){
          localStorage.setItem(STORE+":"+k,JSON.stringify(j.data[k]));
        });
        if(key)localStorage.setItem(STORE+":__share",JSON.stringify({id:id,editKey:key}));
        setLoaded({title:j.title,updatedBy:j.updatedBy,updatedAt:j.updatedAt,canEdit:!!key});
        // 取り込んだ内容を反映するため再読込（?ws= は外す）
        if(!sessionStorage.getItem("di_loaded_"+id)){
          sessionStorage.setItem("di_loaded_"+id,"1");
          location.replace(location.pathname);
        }
        setBusy(false);
      })
      .catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  },[]);

  const remember=function(v){setWho(v);try{localStorage.setItem("di_who",v);}catch(e){}};
  const body=function(){
    return {tool:STORE, title:title||document.title, who:who,
      data:(typeof collectAll==="function"?collectAll():{})};
  };
  const create=function(){
    setBusy(true);setMsg("");
    fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body())})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg(j.error);setBusy(false);return;}
        var nx={id:j.id,editKey:j.editKey};
        localStorage.setItem(STORE+":__share",JSON.stringify(nx));
        setInfo(nx);setMsg("サーバーに保存しました");setBusy(false);
      }).catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  };
  const update=function(){
    if(!info)return create();
    setBusy(true);setMsg("");
    fetch(API+"?id="+info.id+"&key="+info.editKey,{method:"PUT",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body())})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){setMsg(j.error);setBusy(false);return;}
        setMsg("サーバーに保存しました（"+new Date().toLocaleTimeString("ja-JP")+"）");setBusy(false);
      }).catch(function(){setMsg("サーバーに接続できませんでした");setBusy(false);});
  };
  const linkView=info?(location.origin+location.pathname+"?ws="+info.id):"";
  const linkEdit=info?(linkView+"&key="+info.editKey):"";
  const copy=function(t,label){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){setMsg(label+"をコピーしました");
        setTimeout(function(){setMsg("");},3000);});
    }else{
      var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");setMsg(label+"をコピーしました");}catch(e){}
      document.body.removeChild(ta);
    }
  };
  const bs={border:0,borderRadius:7,padding:"7px 12px",cursor:"pointer",fontSize:12.5};
  return (<div className="noprint" style={{background:"#eef4fb",border:"1px solid #c5d8f5",borderRadius:10,
      padding:"10px 12px",margin:"0 0 12px",fontSize:13,color:"#1a4d8f"}}>
    <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
      <span>☁️ <b>サーバーに保存して、チームで共有できます</b></span>
      <span style={{flex:1}}></span>
      <input value={who} onChange={function(e){remember(e.target.value);}} placeholder="お名前（任意）"
        style={{border:"1px solid #b9cbe4",borderRadius:6,padding:"6px 8px",fontSize:12.5,width:120}}/>
      {!info && <button onClick={create} disabled={busy}
        style={Object.assign({},bs,{background:"#2b6cb0",color:"#fff"})}>{busy?"保存中…":"サーバーに保存"}</button>}
      {info && <button onClick={update} disabled={busy}
        style={Object.assign({},bs,{background:"#2b6cb0",color:"#fff"})}>{busy?"保存中…":"変更を保存"}</button>}
    </div>
    {loaded && <div style={{marginTop:8,background:"#fff",borderRadius:8,padding:"8px 10px"}}>
      📥 共有リンクから読み込みました{loaded.updatedBy?"（最終更新: "+loaded.updatedBy+"）":""}。
      {loaded.canEdit?"このリンクは編集できます。":"このリンクは閲覧専用です（変更しても他の人には反映されません）。"}
    </div>}
    {info && <div style={{marginTop:8,background:"#fff",borderRadius:8,padding:"8px 10px",lineHeight:2}}>
      <div><b>閲覧用リンク</b>（見るだけ）
        <button onClick={function(){copy(linkView,"閲覧用リンク");}} style={Object.assign({},bs,{background:"#e2e8f0",color:"#334155",marginLeft:6})}>コピー</button>
        <div style={{fontSize:11.5,color:"#667",wordBreak:"break-all"}}>{linkView}</div></div>
      <div style={{marginTop:6}}><b>編集用リンク</b>（変更もできる／取扱注意）
        <button onClick={function(){copy(linkEdit,"編集用リンク");}} style={Object.assign({},bs,{background:"#e2e8f0",color:"#334155",marginLeft:6})}>コピー</button>
        <div style={{fontSize:11.5,color:"#667",wordBreak:"break-all"}}>{linkEdit}</div></div>
    </div>}
    {msg && <div style={{marginTop:6,fontWeight:"bold"}}>{msg}</div>}
    <div style={{marginTop:6,fontSize:11.5,color:"#5b7fb0"}}>
      ※「サーバーに保存」を押したときだけ送信されます。押さなければ、これまで通り端末内だけで処理されます。
    </div>
  </div>);
}
